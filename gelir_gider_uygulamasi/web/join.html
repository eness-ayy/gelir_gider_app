<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hesaply - Odaya Davet Edildiniz</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: #F8FAFC;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #0D9488 0%, #0F766E 100%);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.35);
    }
    .logo-badge svg {
      width: 34px;
      height: 34px;
      fill: #FFFFFF;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .tagline {
      font-size: 14px;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    .room-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed rgba(13, 148, 136, 0.4);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .room-name {
      font-size: 16px;
      font-weight: 700;
      color: #38BDF8;
      margin-bottom: 4px;
    }
    .code-label {
      font-size: 12px;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .room-code {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #2DD4BF;
      margin-top: 4px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: #0D9488;
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
    }
    .btn-primary:hover {
      background: #0F766E;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .footer-note {
      font-size: 12px;
      color: #64748B;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </div>
    <h1>Hesaply Odasına Davet</h1>
    <p class="tagline">Ortak harcama ve ev bütçenizi kolayca yönetin</p>

    <div class="room-box">
      <div id="roomName" class="room-name">Ortak Oda</div>
      <div class="code-label">Davet Kodu</div>
      <div id="roomCode" class="room-code">------</div>
    </div>

    <a id="openAppBtn" href="#" class="btn btn-primary">
      🚀 Uygulamayı Aç ve Katıl
    </a>

    <a id="playStoreBtn" href="#" class="btn btn-secondary">
      🛒 Google Play Store'dan İndir
    </a>

    <p class="footer-note">
      Cihazınızda Hesaply yüklüyse uygulama otomatik açılacaktır. Yüklü değilse Google Play sayfasına yönlendirilirsiniz.
    </p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = (params.get('code') || '').toUpperCase();
    const name = params.get('name') || 'Ortak Ev/Yurt Odası';

    if (name) document.getElementById('roomName').innerText = name;
    if (code) document.getElementById('roomCode').innerText = code;

    const appSchemeUrl = "hesaply://join?code=" + encodeURIComponent(code);
    const playStoreUrl = "https://play.google.com/store/apps/details?id=com.hesaply.app";

    document.getElementById('openAppBtn').href = appSchemeUrl;
    document.getElementById('playStoreBtn').href = playStoreUrl;

    // Mobil cihazda otomatik açmayı tetikle
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      window.location.href = appSchemeUrl;

      // 1.8 saniye sonra uygulama açılmadıysa Play Store'a git
      setTimeout(function() {
        window.location.href = playStoreUrl;
      }, 1800);
    }
  </script>
</body>
</html>
